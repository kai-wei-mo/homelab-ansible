---
- name: Set k3s role from inventory groups
  ansible.builtin.set_fact:
    k3s_role: "{{ 'server' if inventory_hostname in (groups['k3s_servers'] | default([])) else 'agent' }}"

- name: Combine common and host k3s node labels
  ansible.builtin.set_fact:
    k3s_node_labels_effective: "{{ (k3s_common_node_labels | default([])) + (k3s_node_labels | default([])) }}"

- name: Include k3s server tasks
  ansible.builtin.include_tasks: server.yaml
  when: k3s_role == "server"

- name: Include k3s agent tasks
  ansible.builtin.include_tasks: agent.yaml
  when: k3s_role == "agent"
