---
# Join this host as a k3s worker. Uses the server's embedded containerd, so
# Docker (Pterodactyl Wings) can keep running on the same machine.

- name: Require a k3s server in inventory
  ansible.builtin.assert:
    that:
      - groups['k3s_servers'] | default([]) | length > 0
    fail_msg: >-
      k3s agents need a host in the k3s_servers group so they can fetch the
      join token and API URL.

- name: Set k3s server connection facts
  ansible.builtin.set_fact:
    k3s_server_inventory_hostname: "{{ groups['k3s_servers'][0] }}"
    k3s_server_url_effective: "{{ k3s_server_url | default('https://' + hostvars[groups['k3s_servers'][0]].ansible_host + ':' + (k3s_apiserver_port | default(6443) | string), true) }}"
    k3s_node_name: "{{ k3s_node_name | default(inventory_hostname, true) }}"
    k3s_node_ip: "{{ k3s_node_ip | default(ansible_host, true) }}"

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Read k3s version from server
  ansible.builtin.command:
    cmd: k3s --version
  register: k3s_server_version_cmd
  delegate_to: "{{ k3s_server_inventory_hostname }}"
  become: true
  changed_when: false

- name: Parse k3s version from server
  ansible.builtin.set_fact:
    k3s_install_version: "{{ k3s_server_version_cmd.stdout_lines[0].split(' ')[2] }}"

- name: Read k3s node token from server
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_slurp
  delegate_to: "{{ k3s_server_inventory_hostname }}"
  become: true
  no_log: true

- name: Set k3s node token
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_node_token_slurp.content | b64decode | trim }}"
  no_log: true

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy k3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: k3s_agent_config

- name: Deploy Harbor registry auth
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: k3s_registries

- name: Install k3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_install_version }}"
    INSTALL_K3S_EXEC: agent

- name: Restart k3s-agent to pick up config
  when:
    - k3s_agent_config.changed or k3s_registries.changed
    - k3s_binary.stat.exists
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted

- name: Ensure k3s-agent service is enabled and running
  ansible.builtin.service:
    name: k3s-agent
    enabled: yes
    state: started

- name: Wait for agent node to become Ready
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - node
      - "{{ k3s_node_name }}"
      - -o
      - 'jsonpath={.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_agent_node
  delegate_to: "{{ k3s_server_inventory_hostname }}"
  become: true
  changed_when: false
  retries: 30
  delay: 5
  until:
    - k3s_agent_node.rc == 0
    - k3s_agent_node.stdout == "True"
