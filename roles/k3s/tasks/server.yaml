---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Discover Tailscale identity for apiserver tls-san
  ansible.builtin.command:
    cmd: tailscale status --json
  register: k3s_tailscale_status
  changed_when: false
  failed_when: false

- name: Parse Tailscale status
  when:
    - k3s_tailscale_status.rc | default(1) == 0
    - k3s_tailscale_status.stdout | default('') | length > 0
  ansible.builtin.set_fact:
    k3s_tailscale_status_parsed: "{{ k3s_tailscale_status.stdout | from_json }}"

- name: Build apiserver tls-san list
  ansible.builtin.set_fact:
    k3s_tls_sans_effective: "{{
        (
          (k3s_tls_sans | default([]))
          + (k3s_traefik_external_ips | default([]))
          + ((((k3s_tailscale_status_parsed | default({})).Self | default({})).TailscaleIPs) | default([]))
          + [
              inventory_hostname,
              ansible_host | default(''),
              (((k3s_tailscale_status_parsed | default({})).Self | default({})).DNSName | default('') | regex_replace('\\.$', ''))
            ]
        )
        | select('string')
        | reject('equalto', '')
        | unique
        | list
      }}"

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy k3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  register: k3s_server_config

- name: Install k3s
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -s - \
      --write-kubeconfig-mode 644
  args:
    creates: /usr/local/bin/k3s

# Tailscale Serve on :6443 binds 100.x:6443 in the kernel. k3s listens on
# *:6443, so a leftover Serve from an older playbook makes restart fail.
- name: Stop Tailscale Serve on the k3s apiserver port
  when:
    - k3s_server_config.changed
    - k3s_binary.stat.exists
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - --tcp={{ k3s_apiserver_port | default(6443) }}
      - off
  become: true
  register: k3s_tailscale_serve_off
  changed_when: >-
    k3s_tailscale_serve_off.rc == 0
    and (k3s_tailscale_serve_off.stdout | default('') | length > 0
         or k3s_tailscale_serve_off.stderr | default('') | length > 0)
  failed_when: false

- name: Restart k3s to pick up server config
  when:
    - k3s_server_config.changed
    - k3s_binary.stat.exists
  ansible.builtin.systemd:
    name: k3s
    state: restarted

- name: Ensure k3s service is enabled and running
  ansible.builtin.service:
    name: k3s
    enabled: yes
    state: started

- name: Wait for k3s node to be ready
  ansible.builtin.shell: k3s kubectl get nodes
  register: k3s_nodes
  retries: 10
  delay: 6
  until: k3s_nodes.rc == 0

- name: Configure Traefik (pinned NodePorts and optional external IPs)
  block:
    - name: Deploy Traefik HelmChartConfig
      ansible.builtin.template:
        src: traefik-helmchartconfig.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/traefik-tailscale.yaml
        owner: root
        group: root
        mode: "0644"
      become: true
      register: traefik_helmchartconfig

    - name: Wait for Traefik HelmChartConfig to be applied
      when: traefik_helmchartconfig is changed
      ansible.builtin.command:
        cmd: k3s kubectl get svc traefik -n kube-system -o json
      register: traefik_svc
      until: >-
        {{
          (
            k3s_traefik_external_ips | length == 0
            or (
              k3s_traefik_external_ips
              | difference((traefik_svc.stdout | from_json).spec.externalIPs | default([]))
              | length == 0
            )
          )
          and (
            (traefik_svc.stdout | from_json).spec.ports
            | selectattr('name', 'equalto', 'web')
            | map(attribute='nodePort')
            | first
            | string
          ) == (k3s_traefik_node_ports.web | string)
          and (
            (traefik_svc.stdout | from_json).spec.ports
            | selectattr('name', 'equalto', 'websecure')
            | map(attribute='nodePort')
            | first
            | string
          ) == (k3s_traefik_node_ports.websecure | string)
        }}
      retries: 24
      delay: 10
      changed_when: false

- set_fact:
    k3s_config_dir: "{{ ansible_facts['env']['HOME'] }}/.kube"

- debug:
    var: k3s_config_dir

- name: Ensure kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0700"

- name: Render k3s config from template
  ansible.builtin.template:
    src: templates/k3s.config.yaml.j2
    dest: "{{ k3s_config_dir }}/k3s.config.yaml"
    owner: "{{ ansible_user }}"
    mode: "0600"

- name: Set k3s rancher kubeconfig fact
  ansible.builtin.set_fact:
    k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml

- debug:
    msg: "k3s kubeconfig lives at {{ k3s_kubeconfig }}"
