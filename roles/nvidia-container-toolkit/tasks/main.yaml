---
- name: Configure NVIDIA Container Toolkit
  when: nvidia_container_toolkit_enabled | bool
  block:
    - name: Check for the WSL CUDA driver
      ansible.builtin.stat:
        path: /usr/lib/wsl/lib/libcuda.so.1
      register: nvidia_wsl_cuda_driver

    - name: Require the Windows NVIDIA driver
      ansible.builtin.assert:
        that:
          - nvidia_wsl_cuda_driver.stat.exists
        fail_msg: >-
          WSL cannot see the CUDA driver. Install or update the NVIDIA driver
          on Windows; do not install a Linux NVIDIA display driver inside WSL.

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install NVIDIA container repository key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add NVIDIA container repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
          https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
        filename: nvidia-container-toolkit
        state: present

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Configure the NVIDIA runtime for Docker
      ansible.builtin.command:
        argv:
          - nvidia-ctk
          - runtime
          - configure
          - --runtime=docker
      register: nvidia_runtime_config
      changed_when: >-
        'Wrote updated config' in
        ((nvidia_runtime_config.stdout | default('')) ~
         (nvidia_runtime_config.stderr | default('')))
      notify: Restart Docker

    - name: Apply Docker runtime configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify GPU access from Docker
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --gpus
          - all
          - "{{ nvidia_container_toolkit_cuda_image }}"
          - nvidia-smi
      changed_when: false
      when: not ansible_check_mode
