---
- name: Check whether Wings config exists
  ansible.builtin.stat:
    path: "{{ pterodactyl_config_dir }}/config.yml"
  register: pterodactyl_wings_config_stat

- name: Set Wings config present fact
  ansible.builtin.set_fact:
    pterodactyl_wings_config_present: "{{ pterodactyl_wings_config_stat.stat.exists }}"

- name: Create Pterodactyl directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ pterodactyl_config_dir }}"
    - "{{ pterodactyl_data_dir }}"
    - "{{ pterodactyl_log_dir }}"

- name: Download Wings binary
  ansible.builtin.get_url:
    url: >-
      https://github.com/pterodactyl/wings/releases/download/{{ pterodactyl_wings_version }}/wings_linux_{{ normalized_arch }}
    dest: "{{ pterodactyl_wings_bin }}"
    mode: "0755"

- name: Install Wings systemd unit
  ansible.builtin.template:
    src: wings.service.j2
    dest: /etc/systemd/system/wings.service
    mode: "0644"

- name: Enable and start Wings
  ansible.builtin.systemd:
    name: wings
    enabled: true
    state: started
    daemon_reload: true
  when: pterodactyl_wings_config_present | bool

- name: Wings not started — config.yml missing
  ansible.builtin.debug:
    msg: >-
      Wings binary installed but not started: {{ pterodactyl_config_dir }}/config.yml
      is missing. Create a node in the panel, run `wings configure`, then re-run
      this playbook or `systemctl start wings`.
  when: not (pterodactyl_wings_config_present | bool)
