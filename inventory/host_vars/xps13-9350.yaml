---
tailscale_advertise_routes:
  - "192.168.86.0/24"

# Traefik accepts ingress on this Tailscale IP (matches *.home.chaewon.io wildcard DNS).
# Also used as a k3s apiserver tls-san so kubectl can target this IP over Tailscale.
k3s_traefik_external_ips:
  - "100.112.46.91"

k3s_node_labels:
  - chaewon.disk=seagate
  - chaewon.hardware=xps13-9350
  - chaewon.os-version=24.04

# Boot console-only and blank the laptop panel (see roles/common display-power).
display_power_off: true

# External Seagate drive (exFAT), mounted by the local-storage role.
local_storage_mounts:
  - device: LABEL=Seagate
    path: /mnt/seagate
    fstype: exfat
    opts: defaults,nofail,noatime,x-systemd.device-timeout=10

# Auto-share top-level dirs under /mnt/seagate (see roles/nfs-samba/tasks/README.md).
samba_storage_root: /mnt/seagate
