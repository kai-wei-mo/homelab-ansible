---
tailscale_advertise_routes:
  - "192.168.86.0/24"

# External Seagate drive (exFAT), mounted by the local-storage role.
local_storage_mounts:
  - device: LABEL=Seagate
    path: /mnt/seagate
    fstype: exfat
    opts: defaults,nofail,noatime,x-systemd.device-timeout=10

# Auto-export top-level dirs under /mnt/seagate (see roles/nfs/tasks/README.md).
nfs_storage_root: /mnt/seagate
